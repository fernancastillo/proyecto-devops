name: Despliegue continuo

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: entrega-devops-cluster

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-session-token: ${{secrets.AWS_SESSION_TOKEN}}
          aws-region: ${{env.AWS_REGION}}

      - name: Login en ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push de las imágenes
        run: |
          docker compose build
          docker compose push

      - name: Configurar kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{env.AWS_REGION}} \
            --name ${{env.EKS_CLUSTER}}

      - name: Instalar Metrics Server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          echo "Esperando que Metrics Server esté listo..."
          kubectl wait --for=condition=available deployment/metrics-server \
            -n kube-system --timeout=120s

      - name: Aplicar manifiestos Kubernetes
        run: |
          kubectl apply -f infra/k8s/secrets.yml
          kubectl apply -f infra/k8s/mysql.yml
          kubectl apply -f infra/k8s/backend-ventas.yml
          kubectl apply -f infra/k8s/backend-despachos.yml
          kubectl apply -f infra/k8s/frontend.yml
          kubectl apply -f infra/k8s/autoscaling.yml

      - name: Forzar redeploy de las imágenes
        run: |
          kubectl rollout restart deployment/backend-ventas
          kubectl rollout restart deployment/backend-despachos
          kubectl rollout restart deployment/frontend

      - name: Esperar que los deployments estén listos
        run: |
          kubectl rollout status deployment/backend-ventas --timeout=180s
          kubectl rollout status deployment/backend-despachos --timeout=180s
          kubectl rollout status deployment/frontend --timeout=180s

      - name: Obtener URL pública del frontend
        run: |
          echo "=== Servicios del cluster ==="
          kubectl get svc
          echo ""
          echo "=== URL pública del frontend ==="
          kubectl get svc frontend \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'

      - name: Estado del autoscaling
        run: |
          echo "=== Estado del HPA ==="
          kubectl get hpa

      - name: Evidencia de logs con kubectl
        run: |
          echo "=== Pods corriendo ==="
          kubectl get pods
          echo ""
          echo "=== Logs backend-ventas ==="
          kubectl logs deployment/backend-ventas --tail=20
          echo ""
          echo "=== Logs backend-despachos ==="
          kubectl logs deployment/backend-despachos --tail=20

      - name: Evidencia de logs con CloudWatch
        run: |
          echo "=== Consultando logs en CloudWatch ==="
          aws logs describe-log-groups \
            --log-group-name-prefix "/aws/eks" \
            --region ${{env.AWS_REGION}}
          echo ""
          echo "=== Estado del cluster EKS ==="
          aws eks describe-cluster \
            --name ${{env.EKS_CLUSTER}} \
            --region ${{env.AWS_REGION}} \
            --query 'cluster.{status:status,version:version,endpoint:endpoint}'

      - name: Simulación de recuperación
        run: |
          echo "=== Pods antes de eliminar ==="
          kubectl get pods
          echo ""
          echo "=== Eliminando un pod de backend-ventas ==="
          kubectl delete pod $(kubectl get pods -l app=backend-ventas \
            -o jsonpath='{.items[0].metadata.name}')
          echo ""
          echo "=== Esperando recuperación automática ==="
          sleep 20
          echo ""
          echo "=== Pods después de recuperación ==="
          kubectl get pods